name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore: release ') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version and generate release notes
        id: bump
        shell: python
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          pyproject_path = pathlib.Path("cli/pyproject.toml")
          init_path = pathlib.Path("cli/threeplugpro/__init__.py")

          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          version = tomllib.loads(pyproject_text)["project"]["version"]
          major, minor, patch = map(int, version.split("."))
          next_version = f"{major}.{minor}.{patch + 1}"

          pyproject_path.write_text(
              re.sub(
                  r'version = "[^"]+"',
                  f'version = "{next_version}"',
                  pyproject_text,
                  count=1,
              ),
              encoding="utf-8",
          )

          init_text = init_path.read_text(encoding="utf-8")
          init_path.write_text(
              re.sub(
                  r'__version__ = "[^"]+"',
                  f'__version__ = "{next_version}"',
                  init_text,
                  count=1,
              ),
              encoding="utf-8",
          )

          try:
              previous_tag = (
                  subprocess.check_output(
                      ["git", "describe", "--tags", "--abbrev=0"],
                      text=True,
                  ).strip()
              )
              log_range = f"{previous_tag}..HEAD"
              log_output = subprocess.check_output(
                  ["git", "log", "--pretty=format:%s", log_range],
                  text=True,
              ).strip()
          except subprocess.CalledProcessError:
              log_output = subprocess.check_output(
                  ["git", "log", "--pretty=format:%s"],
                  text=True,
              ).strip()

          notes_lines = [line.strip() for line in log_output.splitlines() if line.strip()]
          notes_path = pathlib.Path(f"design/release-notes-{next_version}.md")
          if not notes_lines:
              notes_lines = ["Automated release from the latest main branch changes."]

          body_lines = [
              f"# 3plug-pro {next_version} Release Notes",
              "",
              "## Summary",
              "",
              "Automated patch release from `main`.",
              "",
              "## Included",
              "",
          ]
          body_lines.extend(f"* {line}" for line in notes_lines)
          body_lines.extend(
              [
                  "",
                  "## Operator impact",
                  "",
                  "* install and update flows default to the current stable release tag",
                  "* use the runbook in `design/server-operator-runbook.md` for operator steps",
              ]
          )
          notes_path.write_text("\n".join(body_lines) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              print(f"version={next_version}", file=handle)

      - name: Commit version bump
        run: |
          git add cli/pyproject.toml cli/threeplugpro/__init__.py design/release-notes-*.md
          git commit -m "chore: release ${{ steps.bump.outputs.version }}"

      - name: Push release commit
        run: git push origin HEAD:main

      - name: Create and push release tag
        run: |
          git tag v${{ steps.bump.outputs.version }}
          git push origin v${{ steps.bump.outputs.version }}

      - name: Build release artifacts
        run: python -m build cli

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          body_path: design/release-notes-${{ steps.bump.outputs.version }}.md
          files: |
            cli/dist/*
