name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify release tag matches package version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          ref_name = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("cli/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          if ref_name != expected_tag:
              raise SystemExit(
                  f"Release tag {ref_name!r} does not match cli/pyproject.toml version {version!r}."
              )

      - name: Build release artifacts
        run: python -m build cli

      - name: Prepare release notes
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("cli/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          notes_path = pathlib.Path(f"design/release-notes-{version}.md")
          out_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
          if notes_path.exists():
              out_path.write_text(notes_path.read_text(encoding="utf-8"), encoding="utf-8")
          else:
              out_path.write_text(
                  f"# 3plug {version} Release\n\n"
                  "This release was created automatically from a Git tag.\n",
                  encoding="utf-8",
              )
          print(f"RELEASE_NOTES_PATH={out_path}", file=open(os.environ["GITHUB_ENV"], "a", encoding="utf-8"))

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            cli/dist/*
